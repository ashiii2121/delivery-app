services:
  # Backend API
  - type: web
    name: delivery-app-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18
    repo: https://github.com/ashiii2121/delivery-app.git
    rootDir: delivery/backend
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false

  # Frontend
  - type: web
    name: delivery-app-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18
    repo: https://github.com/ashiii2121/delivery-app.git
    rootDir: delivery/frontend